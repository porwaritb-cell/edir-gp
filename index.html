// the same painting is used for the page background and for the PMREM reflection environment
function paintSky(w, h, mode) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;

  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h);
  SKY[mode].stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);

  // sun by day, moon halo by night
  const sx = w * .64;
  const sy = h * .3;
  const sg = g.createRadialGradient(sx, sy, 2, sx, sy, h * .18);
  sg.addColorStop(0, SKY[mode].glow);
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sg;
  g.fillRect(0, 0, w, h);

  if (mode === 'night') {
    for (let i = 0; i < 260; i++) {
      const z = 1 + Math.random() * 1.6;
      g.fillStyle = `rgba(255,255,255,${.3 + Math.random() * .7})`;
      g.fillRect(Math.random() * w, Math.random() * h * .55, z, z);
    }
    g.fillStyle = '#f6f1da';
    g.beginPath();
    g.arc(sx, sy, h * .025, 0, 7);
    g.fill();
  }
  return c;
}

function audioCtx() {
  actx = actx ?? new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}

function out() {
  const c = audioCtx();
  if (!master) {
    master = c.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(c.destination);
  }
  c.resume();
  return master;
}

function track(a) {
  audioBank.add(a);
  a.addEventListener('ended', () => audioBank.delete(a));
  a.muted = muted;
  return a;
}

function chime(key) {
  const c = audioCtx();
  const t = c.currentTime;
  const f = NOTES[key] ?? 523;
  const g = c.createGain();
  const o = c.createOscillator();
  const o2 = c.createOscillator();

  o.type = 'triangle';
  o2.type = 'sine';
  o.frequency.value = f;
  o2.frequency.value = f * 2;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.18, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);

  o.connect(g);
  o2.connect(g);
  g.connect(out());
  o.start(t);
  o2.start(t);
  o.stop(t + 1);
  o2.stop(t + 1);
}

function play(key) {
  if (muted) return;
  const a = track(new Audio(SOUNDS[key] ?? SOUNDS.click));
  a.volume = 0.8;
  a.play().catch(() => chime(key));
}

function introMusic() {
  if (muted) return;
  const a = track(new Audio(SOUNDS.intro));
  a.volume = 0.7;
  a.play().catch(() => {
    const c = audioCtx();
    c.resume();
    const t0 = c.currentTime + 0.1;
    const seq = [293.7, 440, 587.3, 659.3, 587.3, 493.9, 440, 392, 440, 587.3, 659.3, 784, 659.3, 587.3, 493.9, 440, 392, 329.6, 293.7, 392, 440, 587.3, 440, 293.7];
    seq.forEach((f, i) => {
      const t = t0 + i * 0.44;
      const g = c.createGain();
      const o = c.createOscillator();
      const o2 = c.createOscillator();
      const lp = c.createBiquadFilter();

      o.type = 'triangle';
      o2.type = 'sine';
      o.frequency.value = f;
      o2.frequency.value = f * 2;
      lp.type = 'lowpass';
      lp.frequency.value = 2400;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);

      o.connect(lp);
      o2.connect(lp);
      lp.connect(g);
      g.connect(out());
      o.start(t);
      o2.start(t);
      o.stop(t + 1.6);
      o2.stop(t + 1.6);
    });
  });
}

  a.loop = true;
  a.volume = 0.35;
  a.muted = muted;
  ambient = a;
  a.play().catch(() => {
    const c = audioCtx();
    const len = c.sampleRate * 3;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    const src = c.createBufferSource();
    const f = c.createBiquadFilter();
    const g = c.createGain();
    const lfo = c.createOscillator();
    const lg = c.createGain();

    src.buffer = buf;
    src.loop = true;
    f.type = 'lowpass';
    f.frequency.value = 500;
    g.gain.value = 0.05;
    lfo.frequency.value = 0.15;
    lg.gain.value = 0.03;

    lfo.connect(lg);
    lg.connect(g.gain);
    src.connect(f);
    f.connect(g);
    g.connect(out());
    src.start();
    lfo.start();
  });
}


function cloudTex(seed) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');

  let sd = seed;
  const rnd = () => (sd = sd * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    const x = 90 + rnd() * 332;
    const y = 90 + rnd() * 332;
    const r = 30 + rnd() * 70;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }

  // fade the edge so the disc has no outline
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(256, 256, 60, 256, 256, 256);
  m.addColorStop(0, '#fff');
  m.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = m;
  g.fillRect(0, 0, 512, 512);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// raked lines plus concentric rings around the two rock clusters, in model coordinates
function sandTexture() {
  const W = 2048;
  const H = 808;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;

  const g = c.getContext('2d');
  const X = x => (x + 6.15) / 12.3 * W;
  const Y = z => (1 - (z - 1.3) / 4.85) * H;
  const R = W / 12.3;

  g.fillStyle = '#ece5d2';
  g.fillRect(0, 0, W, H);
  g.lineWidth = 3;

  const line = (y, dy) => {
    g.strokeStyle = '#c9c0a8';
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(W, y);
    g.stroke();
    g.strokeStyle = '#faf6ea';
    g.beginPath();
    g.moveTo(0, y + dy);
    g.lineTo(W, y + dy);
    g.stroke();
  };
  for (let z = 1.3; z < 6.15; z += 0.14) line(Y(z), 3);

  for (const [cx, cz] of [[-2.9, 3.7], [2.9, 3.3]]) {
    g.fillStyle = '#ece5d2';
    g.beginPath();
    g.arc(X(cx), Y(cz), 2.65 * R, 0, 7);
    g.fill();
    for (let r = 0.6; r < 2.6; r += 0.14) {
      g.strokeStyle = '#c9c0a8';
      g.beginPath();
      g.arc(X(cx), Y(cz), r * R, 0, 7);
      g.stroke();
      g.strokeStyle = '#faf6ea';
      g.beginPath();
      g.arc(X(cx), Y(cz), r * R + 3, 0, 7);
      g.stroke();
    }
  }

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function relief(str, size, hex) {

// snow line and rock-to-sky gradient baked into per-vertex colours
function paintMountain(g) {
  const p = g.attributes.position;
  let lo = 1e9, hi = -1e9;
  for (let i = 0; i < p.count; i++) {
    lo = Math.min(lo, p.getY(i));
    hi = Math.max(hi, p.getY(i));
  }

  const a = new THREE.Color('#5f7a58');
  const b = new THREE.Color('#7d86a3');
  const s = new THREE.Color('#f7f9ff');
  const c = new THREE.Color();
  const col = new Float32Array(p.count * 3);

  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) - lo) / (hi - lo);
    const n = Math.sin(p.getX(i) * 3.1) * Math.cos(p.getZ(i) * 2.7) * 0.06;
    if (t + n > 0.58) c.copy(s);
    else c.copy(a).lerp(b, Math.min(1, t / 0.5));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

// wind sway injected into the canopy material
function sway(m, amp) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float k = smoothstep(0.5, 4.0, position.y);
        transformed.x += sin(uTime * 1.3 + position.x * 0.9 + position.z * 0.7) * ${amp.toFixed(3)} * k;
        transformed.z += cos(uTime * 1.1 + position.z * 0.8 - position.x * 0.6) * ${amp.toFixed(3)} * k;
        transformed.y += sin(uTime * 2.0 + position.x * 1.7) * ${(amp * 0.4).toFixed(3)} * k;`);
  };
}

// the water grid is built by hand so the ripple shader owns every vertex
function makeWater() {
  const R = 1.22;
  const rings = 30;
  const seg = 72;
  const pos = [0, 0, 0];
  const idx = [];

  for (let i = 1; i <= rings; i++) {
    for (let j = 0; j < seg; j++) {
      const r = R * i / rings;
      const a = j / seg * Math.PI * 2;
      pos.push(Math.cos(a) * r, 0, Math.sin(a) * r);
    }
  }
  for (let j = 0; j < seg; j++) idx.push(0, 1 + (j + 1) % seg, 1 + j);
  for (let i = 1; i < rings; i++) {
    for (let j = 0; j < seg; j++) {
      const a = 1 + (i - 1) * seg + j;
      const b = 1 + (i - 1) * seg + (j + 1) % seg;
      const c = 1 + i * seg + j;
      const d = 1 + i * seg + (j + 1) % seg;
      idx.push(a, b, c, b, d, c);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(pos.map((p, i) => i % 3 === 1 ? 1 : 0), 3));
  g.setIndex(idx);

  const mt = new THREE.MeshStandardMaterial({

    color: 0x2f94a6, roughness: .06, 
    metalness: .1, transparent: true, 
    opacity: .85, envMapIntensity: 1.8

  });
  mt.onBeforeCompile = sh => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime;
        float waveH(vec2 p) { float r = length(p), edge = 1.0 - smoothstep(0.85, 1.22, r);
         return (sin(r * 16.0 - uTime * 2.6) * 0.5 + sin(p.x * 9.0 + uTime * 1.4) * 0.3 + sin(p.y * 11.0 - uTime * 1.8) * 0.2) * 0.05 * edge; }`)
      .replace('#include <beginnormal_vertex>', `vec2 wp = position.xz; float e = 0.02;
        float hx = waveH(wp + vec2(e, 0.0)) - waveH(wp - vec2(e, 0.0)), hz = waveH(wp + vec2(0.0, e)) - waveH(wp - vec2(0.0, e));
        vec3 objectNormal = normalize(vec3(-hx / (2.0 * e), 1.0, -hz / (2.0 * e)));
        #ifdef USE_TANGENT
        vec3 objectTangent = vec3(tangent.xyz);
        #endif`)
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n transformed.y += waveH(position.xz);');
  };

  const w = new THREE.Mesh(g, mt);
  w.position.set(-6.9, 0.19, 7.8);
  w.receiveShadow = true;
  return w;
}

function cropPhoto(t) {

  glow2.intensity = L(.8, 5, k);
  if (night.lamp) night.lamp.emissiveIntensity = L(3, 14, k);
  night.sakura.forEach(m => { m.emissiveIntensity = L(.05, .35, k); });
  night.lights.forEach(l => { l.intensity = L(0, .3, k); });
  night.sprites.forEach(sp => { sp.material.opacity = k * .9; });

  cloudMats.forEach(m => m.color.lerpColors(white, cloudN, k));
  fogSprites.forEach(f => f.material.color.lerpColors(white, cloudN, k));
  bounce.forEach(l => { l.intensity = L(7, 16, k); });
  boardLights.forEach(l => { l.intensity = L(0, l.userData.max ?? 2.4, k); });
  boards.forEach(o => { o.userData.mat.userData.base = L(0, .55, k); });
  petals.material.color.setScalar(L(1, .8, k));
}

// lantern point lights and soft halos that fade in at night
function buildNightRig() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,200,120,1)');
  r.addColorStop(1, 'rgba(255,160,60,0)');
  g.fillStyle = r;
  g.fillRect(0, 0, 64, 64);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;

  // the five stone lanterns of the model
  const LANTERNS = [[5.3, .95, 3.9], [-1.9, .86, 5.7], [-5.4, .86, 7.4], [2.0, .78, 7.3], [-4.1, .78, .8]];
  for (const [x, y, z] of LANTERNS) {
    const l = new THREE.PointLight(0xffb866, 0, 0);
    l.position.set(x, y, z);
    propsRoot.add(l);
    night.lights.push(l);

    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0, toneMapped: false
    }));
    sp.position.set(x, y, z);
    sp.scale.setScalar(1.3);
    propsRoot.add(sp);
    night.sprites.push(sp);
  }
}

async function buildText(topY) {
  const fl = new FontLoader();
  const base = 'https://unpkg.com/three@0.160.0/examples/fonts/';
  const [reg, bold] = await Promise.all([
    fl.loadAsync(base + 'helvetiker_regular.typeface.json'),
    fl.loadAsync(base + 'helvetiker_bold.typeface.json')
  ]);
  await Promise.all([
    document.fonts.load("600 80px 'Shippori Mincho'"),
    document.fonts.load("600 80px 'Noto Serif Thai'", 'ก')
  ]).catch(() => {});

  // Thai becomes relief, Latin becomes real TextGeometry
  const word = (str, o) => {
    let m;
    if (isThai(str)) {
      m = relief(str, o.size, o.color);
    } else {
      const g = txt(str, o.bold ? bold : reg, o.size);
      g.computeBoundingBox();
      m = new THREE.Mesh(g, o.mat);
      m.userData.width = g.boundingBox.max.x;
    }
    if (o.maxW && m.userData.width > o.maxW) {
      const s = o.maxW / m.userData.width;
      m.scale.set(s, s, 1);
    }
    return m;
  };

  sign = new THREE.Group();
  sign.position.set(0, topY - 2.8, 4.5);
  sign.rotation.x = -0.25;
  stage.add(sign);

  const mk = (c, r, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, envMapIntensity: .6 });
  const lacquer = mk(0x1c1714, .3, .1);
  const gold = mk(0xc9a24b, .35, .8);
  const vermilion = mk(0xc8372d, .5);
  const timber = mk(0x4d3220, .75);
  const tile = mk(0x3a414b, .35);
  const pink = mk(0xf6b6cf, .6);
  const labelMat = mk(0xd8b46a, .35, .5);

    o.position.set(x, y, z);
    o.rotation.x = rx;
    sign.add(o);
    return o;
  };

  // board
  part(bx(6.0, 2.9, 0.14), lacquer, 0, 0, 0);

  // gold frame
  [[0, 1.35, 5.8, .04], [0, -1.35, 5.8, .04], [-2.9, 0, .04, 2.7], [2.9, 0, .04, 2.7]]

  part(bx(6.5, .1, .3), timber, 0, 1.7, 0);
  part(bx(6.9, .1, .6), tile, 0, 1.98, .25, .45);

  part(bx(7.0, .12, .16), tile, 0, 2.18, 0);

  // hanko seal

  part(bx(.16, .025, .035), valueMat, 2.65, -1.0, .095);
  part(bx(.025, .16, .035), valueMat, 2.65, -1.0, .095);

  // sakura crest

    const p = SLOT_POS[i];

    const g = new THREE.Group();
    g.position.set(p[0], p[1] + .25, p[2]);

    const body = new THREE.Mesh(bx(1.1, .5, .9), lacquer);
    const cap = new THREE.Mesh(bx(1.16, .04, .96), gold);
    cap.position.y = .26;
    body.castShadow = body.receiveShadow = true;
    body.userData.blocker = cap.userData.blocker = true;
    blockers.push(body, cap);

    const t3 = new THREE.Mesh(txt('PROJECT ' + (4 + i), bold, .1, .02), gold);
    t3.geometry.computeBoundingBox();
    t3.position.set(-t3.geometry.boundingBox.max.x / 2, .06, .46);
    g.add(body, cap, t3);

    if (slot.title) {
      const th = relief(slot.title, .085, '#fff3df');
      const sc = Math.min(1, .95 / th.userData.width);
      th.scale.set(sc, sc, 1);
      th.position.set(-th.userData.width * sc / 2, -.16, .46);
      g.add(th);
    }
    propsRoot.add(g);

    if (!(slot.model || slot.title || slot.link)) return;

    const holder = new THREE.Group();
    holder.position.set(p[0], p[1] + .52, p[2]);
    propsRoot.add(holder);

    const arm = new THREE.Group();
    holder.add(arm);
    if (!slot.crystal) slotSpin.push(arm); // the crystal stays turned 90 degrees

    const crystal = () => {
      // hexagonal crystal (gold or green), about the size of a Rubik's cube, turned 90 degrees
      const h = .56, r = .27;
      const tone = slot.crystal === 'green' ? { c: 0x2fd37a, m: .35, e: 0x0a7a3c } : { c: 0xffc933, m: .75, e: 0xb8860b };
      const geo = new THREE.LatheGeometry([
        new THREE.Vector2(0, 0), new THREE.Vector2(r, h * .2), new THREE.Vector2(r, h * .7), new THREE.Vector2(0, h)
      ], 6);
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({
        color: tone.c, metalness: tone.m, roughness: .12, clearcoat: 1, clearcoatRoughness: .05,
        emissive: tone.e, emissiveIntensity: .35, flatShading: true, envMapIntensity: 1.6
      }));
      m.rotation.y = Math.PI / 2;
      m.castShadow = true;
      arm.add(m);
    };
    const token = () => {
      if (slot.crystal) return crystal();
      const m = new THREE.Mesh(new THREE.OctahedronGeometry(.3), new THREE.MeshStandardMaterial({ color: 0xc9a24b, metalness: .8, roughness: .25 }));
      m.position.y = .45;
      m.castShadow = true;

    };
    const done = () => {
      addPickable(holder, slot.title || 'Project ' + (4 + i), slot.desc || '', 'prop', 'orb');
      Object.assign(holder.userData, { tools: slot.tools, link: slot.link, view: FRONT, dist: 2.2 });
      slotHolders.push(holder);
    };

    if (slot.model) {
      new GLTFLoader().loadAsync(slot.model).then(gl => {
        const m = gl.scene;
        const bb = new THREE.Box3().setFromObject(m);
        const sz = bb.getSize(new THREE.Vector3());

        m.traverse(o => { if (o.isMesh) o.castShadow = true; });
        arm.add(m);
      }).catch(() => token()).finally(done);
    } else {
      token();
      done();
    }
  });

  // floating prompt, billboarded in onBeforeRender
  const hg = txt('Click on the house', bold, 0.3, 0.06);

  stage.add(hint);
}

function buildIsland(model) {
  const meshes = [];
  model.traverse(c => c.isMesh && meshes.push(c));
  model.updateMatrixWorld(true);

  // ground floor with the lower roof, and upper floor with the upper roof
  const HOUSE = [
    new THREE.Box3(new THREE.Vector3(-5.6, 0, -5.7), new THREE.Vector3(5.6, 4.1, 1.9)),
    new THREE.Box3(new THREE.Vector3(-4.6, 3.4, -5.4), new THREE.Vector3(4.6, 8.2, 0.3))
  ];

  // shift each offending tree outward until every blossom blob clears the roofs
  const trees = {};
  for (const m of meshes) {
    const k = /^(SakuraTrunk|Branch|Blossom)(\d+)(_\d+)?$/.exec(m.name);
    if (!k) continue;
    const t = (trees[k[2]] ??= { meshes: [], blobs: [] });
    t.meshes.push(m);
    if (k[1] === 'Blossom') {
      m.geometry.computeBoundingSphere();
      const bs = m.geometry.boundingSphere;
      t.blobs.push({ c: bs.center.clone().applyMatrix4(m.matrixWorld), r: bs.radius * .82 + .12, m });
    }
  }

  const tmp = new THREE.Vector3();
  for (const t of Object.values(trees)) {
    let best = null;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const d = new THREE.Vector3(dx, 0, dz);
      let sft = 0;
      while (sft < 4 && t.blobs.some(b => HOUSE.some(hb => hb.distanceToPoint(tmp.copy(b.c).addScaledVector(d, sft)) < b.r))) sft += 0.1;
      if (sft < 4 && (!best || sft < best.s)) best = { s: sft, d };
    }
    if (best && best.s > 0) {
      t.meshes.forEach(m => {
        m.position.addScaledVector(best.d, best.s);
        m.updateMatrixWorld(true);
      });
      t.blobs.forEach(b => b.c.addScaledVector(best.d, best.s));
    }
    // leftovers still inside the house are deleted
    t.blobs.forEach(b => { if (HOUSE.some(hb => hb.distanceToPoint(b.c) < b.r)) b.m.userData.drop = true; });
  }

  const groups = {};
  for (const m of meshes) {
    const n = m.name;
    const orig = m.material;

    // Blender sky plane, old pond water, culled trees, canopy touching the house
    if (n === 'Backdrop' || n === 'PondWater' || CULL_RE.test(n) || m.userData.drop) {
      m.parent.remove(m);
      continue;
    }

    if (HOUSE_RE.test(n) && !IGNORE_RE.test(n)) {
      m.material = matFor(orig).clone();
      let nb = 0;
      if (/Shoji/.test(n)) nb = 2.6;
      if (/InkWash/.test(n)) {
        m.material.emissive.set(0xfff0d0);
        m.material.emissiveIntensity = 0;
        nb = 1.0;
      }
      if (/^Tatami/.test(n)) {
        m.material.emissive.set(0xb5bb7c);
        m.material.emissiveIntensity = 0;
        nb = 0.35;
      }
      Object.assign(m.userData, { em0: m.material.emissive.clone(), ei0: m.material.emissiveIntensity, nb });
      m.castShadow = m.receiveShadow = true;

      const [title, desc, sfx] = infoFor(n);
      addPickable(m, title, desc, 'part', sfx);
      continue;
    }

    if (/^(FujiMain|Peak)/.test(n)) {
      paintMountain(m.geometry);
      m.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, envMapIntensity: .5 });
      continue;
    }

    if (n === 'ZenSand') {
      const p = m.geometry.attributes.position;
      const uv = new Float32Array(p.count * 2);
      for (let i = 0; i < p.count; i++) uv.set([(p.getX(i) + 6.15) / 12.3, (p.getZ(i) - 1.3) / 4.85], i * 2);
      m.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      m.material = new THREE.MeshStandardMaterial({ map: sandTexture(), roughness: .95 });
      m.receiveShadow = true;
      continue;
    }

    // shrink each canopy blob around its own centre and tint it
    if (/^Blossom/.test(n)) {
      m.geometry.computeBoundingSphere();
      const bc = m.geometry.boundingSphere.center;
      m.geometry.translate(-bc.x, -bc.y, -bc.z);
      m.geometry.scale(.82, .82, .82);
      m.geometry.translate(bc.x, bc.y, bc.z);

      const cnt = m.geometry.attributes.position.count;
      const col = new Float32Array(cnt * 3);
      const k = .85 + Math.random() * .15;
      for (let i = 0; i < cnt; i++) col.set([k, k * (.95 + Math.random() * .05), k * (.95 + Math.random() * .05)], i * 3);
      m.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
    }

    // decor: bake the transform and merge per material, a handful of draw calls instead of ~600
    const g = m.geometry.clone().applyMatrix4(m.matrixWorld);
    (groups[orig.name] ??= { mat: matFor(orig), geos: [] }).geos.push(g);
    m.parent.remove(m);
  }

  for (const gr of Object.values(groups)) {
    const keys = ['position', 'normal', 'uv', 'color'].filter(k => gr.geos.every(g => g.hasAttribute(k)));
    gr.geos.forEach(g => Object.keys(g.attributes).forEach(k => keys.includes(k) || g.deleteAttribute(k)));

    const all = gr.geos.every(g => g.index);
    const none = gr.geos.every(g => !g.index);
    const geos = (all || none) ? gr.geos : gr.geos.map(g => g.index ? g.toNonIndexed() : g);
    const merged = mergeGeometries(geos, false);

    const mesh = new THREE.Mesh(merged || geos[0], gr.mat);
    mesh.castShadow = gr.mat.name !== 'Water';
    mesh.receiveShadow = true;
    model.add(mesh);
  }

  water = makeWater();
  model.add(water);
  addPickable(water, 'Koi pond', 'Every vertex of this water surface is moved by sine ripples in a vertex shader, and its normals are rebuilt each frame so light and sky reflections ripple too.', 'prop', 'water');
  Object.assign(water.userData, { view: new THREE.Vector3(0, 0.6, 0.8).normalize(), dist: 3.0 });

  // fit the island to the 10 x 10 limit, its underside rock sits 1.5 above y = 0 so clouds float below it
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  model.scale.setScalar(9.4 / Math.max(size.x, size.z));

  const b2 = new THREE.Box3().setFromObject(model);
  const c2 = b2.getCenter(new THREE.Vector3());
  model.position.set(-c2.x, -b2.min.y + 1.5, -c2.z);

  // four pink bounce lights, placed on the front canopies that are furthest apart
  const tc = Object.values(trees).map(t => {
    const b = t.blobs.filter(x => !x.m.userData.drop);
    if (!b.length) return null;
    const c = new THREE.Vector3();
    b.forEach(x => c.add(x.c));
    return c.divideScalar(b.length);
  }).filter(c => c && c.z < 1.5 && Math.abs(c.x) < 10);

  const sel = [];
  while (tc.length && sel.length < 4) {
    let bi = 0, bd = -1;
    tc.forEach((c, i) => {
      const d = sel.length ? Math.min(...sel.map(p => p.distanceTo(c))) : -c.z;
      if (d > bd) { bd = d; bi = i; }
    });
    sel.push(tc.splice(bi, 1)[0]);
  }
  sel.forEach(c => {
    const l = new THREE.PointLight(0xff8fb8, 7, 9, 2);
    l.position.set(c.x * .8, c.y + .6, c.z + 1.2);
    propsRoot.add(l);
    bounce.push(l);
  });

  model.add(propsRoot);

  const seen = new Set();
  model.traverse(o => {
    const ms = o.material ? [].concat(o.material) : [];
    ms.forEach(m => {
      if ('envMapIntensity' in m && !seen.has(m)) {
        seen.add(m);
        m.userData.env0 = m.envMapIntensity;
        envMats.push(m);
      }
    });
  });

  stage.add(model);
  model.userData.baseY = model.position.y;
  return model;
}

    if (rest.length) { // "label: value" shows the label in gold
      const b = document.createElement('b');
      b.textContent = label + ': ';
      b.style.color = '#d8b46a';
      li.appendChild(b);
    }
    const value = rest.length ? rest.join(': ') : text;
    if (href) {
      const a = document.createElement('a');
      a.textContent = value;
      a.href = href;
      a.style.color = '#ffc2d9';
      if (!href.startsWith('mailto:')) { a.target = '_blank'; a.rel = 'noopener'; }
      li.appendChild(a);
    } else {
      li.append(value);
    }
    ul.appendChild(li);
  });

  $('bd-g').textContent = b.tags || '';
  const im = $('bd-i');
  im.replaceChildren();
  if (b.image) {
    const i = new Image();
    i.src = b.image;
    i.alt = b.title;
    im.appendChild(i);
  } else {
    im.textContent = '桜';
  }

  const a = $('bd-a');
  a.hidden = !b.link;
  if (b.link) a.href = b.link;
  a.textContent = b.linkText || 'Open ↗';

  bd.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => bd.classList.add('show')));
}

function closeBoard(goHome) {
  bd.classList.remove('show');
  setTimeout(() => { if (!bd.classList.contains('show')) bd.hidden = true; }, 380);
  if (goHome) zoomHome();
}


// picking
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const popup = document.getElementById('popup');
let popTimer = null;

function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);

  // trees are not in this list, so they can never block a click
  const hits = ray.intersectObjects(pickables.concat(blockers), true);
  for (const h of hits) {
    // children such as text, outline and roof resolve to their pickable parent
    let o = h.object;
    while (o && !pickables.includes(o)) {
      if (o.userData.blocker) return { blocked: true };
      o = o.parent;
    }
    if (o) return { object: o, point: h.point };
  }
  return null;
}

function showPopup(o) {
  const u = o.userData;
  const tl = document.getElementById('ptools');
  const a = document.getElementById('plink');

  document.getElementById('pt').textContent = u.title;
  document.getElementById('pd').textContent = u.desc;
  tl.textContent = u.tools || '';
  tl.hidden = !u.tools;
  a.hidden = !u.link;
  if (u.link) a.href = u.link;

  popup.classList.toggle('interactive', !!u.link);
  popup.classList.add('show');
  clearTimeout(popTimer);
  popTimer = setTimeout(() => popup.classList.remove('show'), u.link ? 12000 : 4000);
}

// shared by clicks and the tour: sound, zoom, glow and popup
function activate(o, point, tour) {
  const u = o.userData;
  u.flash = 1;
  u.pop = 1;
  play(u.sfx);
  zoomTo(o, point);
  if (u.kind === 'board' && !tour) setTimeout(() => zoomed && openBoard(u.board), 750);
  else showPopup(o);
}


// camera flight
const backBtn = document.getElementById('back');
const tourBtn = document.getElementById('tour');

function ease(k) {
  return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
}

function flyTo(pos, target, ms = 1100) {
  intro = null;
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), ms };
  controls.enabled = false;
}

function zoomTo(o, point) {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;

  // wall board: fly straight in front of it
  if (o.userData.kind === 'board') {
    const b3 = new THREE.Box3().setFromObject(o);
    const sz = b3.getSize(new THREE.Vector3());
    const c = b3.getCenter(new THREE.Vector3());
    const d = Math.max((sz.y / 2) / Math.tan(v), (sz.x / 2) / (Math.tan(v) * camera.aspect)) * 1.5;
    flyTo(c.clone().add(new THREE.Vector3(0, .12, d)), c);
    zoomed = true;
    backBtn.hidden = false;
    return;
  }

  // name plate: fly in front of it and look straight at it
  if (o.userData.kind === 'sign') {
    const d = Math.max(2.0 / Math.tan(v), 3.7 / (Math.tan(v) * camera.aspect)) * 1.1;
    const n = new THREE.Vector3(0, 0, 1).applyQuaternion(o.getWorldQuaternion(new THREE.Quaternion()));
    const c = o.getWorldPosition(new THREE.Vector3());
    flyTo(c.clone().addScaledVector(n, d), c);
    zoomed = true;
    backBtn.hidden = false;
    return;
  }

  // projects inside the house: look in from the front, under the eaves
  if (o.userData.view) {
    const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
    flyTo(c.clone().addScaledVector(o.userData.view, o.userData.dist), c);
    zoomed = true;
    backBtn.hidden = false;
    return;
  }

  // big parts: zoom to the clicked spot
  const box = new THREE.Box3().setFromObject(o);
  const r = box.getSize(new THREE.Vector3()).length() / 2;
  const focus = (o.userData.kind === 'part' && point) ? point.clone() : box.getCenter(new THREE.Vector3());
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(focus.clone().addScaledVector(dir, THREE.MathUtils.clamp(r * 2.4, 2.4, 8)), focus);
  zoomed = true;
  backBtn.hidden = false;
}

function stopTour() {
  tourId++;
  tourBtn.textContent = 'Tour';
}

function zoomHome() {
  if (!home) return;
  stopTour();
  play('zoom');
  popup.classList.remove('show');
  flyTo(home.pos.clone(), home.target.clone());
  zoomed = false;
  backBtn.hidden = true;
}

async function runTour() {
  if (tourBtn.textContent === 'Stop tour') {
    zoomHome();
    return;
  }
  const id = ++tourId;
  tourBtn.textContent = 'Stop tour';
  if (!bd.hidden) closeBoard(false);

  for (const o of [sign, ...boards, pbr, orb, knot, ...slotHolders, water]) {
    if (!o || id !== tourId) return;
    activate(o, undefined, true);
    await new Promise(r => setTimeout(r, 4800));
  }
  if (id === tourId) zoomHome();
}


// events
addEventListener('pointerdown', startAmbient, { once: true });

renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) return;
  hovered = pick(e)?.object ?? null;
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
});

renderer.domElement.addEventListener('pointerdown', e => {
  downAt = [e.clientX, e.clientY];
});

renderer.domElement.addEventListener('click', e => {
  // it was an orbit drag
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;

  const h = pick(e);
  if (h?.blocked) return;
  if (!h) {
    if (zoomed) zoomHome();
    return;
  }
  stopTour();
  activate(h.object, h.point);
});

document.getElementById('mute').onclick = e => {
  muted = !muted;
  e.target.textContent = muted ? 'Sound: off' : 'Sound: on';
  if (ambient) ambient.muted = muted;
  audioBank.forEach(a => { a.muted = muted; });
  if (master) master.gain.setTargetAtTime(muted ? 0 : 1, master.context.currentTime, .05);
  e.target.setAttribute('aria-pressed', String(!muted));
};

document.getElementById('daynight').onclick = e => {
  night.target = night.target ? 0 : 1;
  e.target.textContent = night.target ? 'Day' : 'Night';
  document.getElementById('sky-night').style.opacity = night.target;
};

tourBtn.onclick = runTour;
backBtn.onclick = zoomHome;
bd.onclick = e => { 
  
  if (e.target === bd || e.target.closest('.bd-x')) closeBoard(true); 

};

// grabbing the camera cancels the tour
controls.addEventListener('start', () => { if (tourBtn.textContent === 'Stop tour') stopTour(); });

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!bd.hidden) closeBoard(true);
  else if (zoomed) zoomHome();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 62 : 45;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});


function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const a = calm ? 0 : 1;

  // intro: spiral down from high above to the home view
  if (intro) {
    const k = Math.min(1, (performance.now() - intro.start) / intro.ms);
    const e = 1 - Math.pow(1 - k, 2.2);
    const s1 = intro.sp1;
    const L = THREE.MathUtils.lerp;
    const sp = new THREE.Spherical(L(s1.radius * 2.1, s1.radius, e), L(0.22, s1.phi, e), s1.theta - (1 - e) * 2.6);
    camera.position.copy(home.target).add(new THREE.Vector3().setFromSpherical(sp));
    controls.target.copy(home.target);
    if (k === 1) {
      intro = null;
      controls.enabled = true;
    }
  }

  if (tween) {
    const k = Math.min(1, (performance.now() - tween.start) / tween.ms);
    const e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k === 1) {
      tween = null;
      controls.enabled = true;
    }
  }

  controls.update();

  orb.material.uniforms.uTime.value = t;
  timeU.value = t;
  applyNight(dt);

  cloudMats.forEach(m => { m.userData.mesh.rotation.z += m.userData.mesh.userData.spin * dt * a; });
  orb.position.y = orb.userData.baseY + Math.sin(t * 1.2) * 0.04 * a;
  knot.rotation.x += dt * 0.6 * a;
  knot.rotation.y += dt * 0.8 * a;
  pbr.rotation.y += dt * 0.5 * a;
  slotSpin.forEach(r => { r.rotation.y += dt * .6 * a; });

  fogSprites.forEach(f => {
    const u = f.userData;
    u.a += u.sp * dt * a;
    f.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * .4 + u.a * 3) * .08 * a, Math.sin(u.a) * u.r);
  });

  boards.forEach(o => {
    const u = o.userData;
    u.glow += ((o === hovered ? 1 : 0) - u.glow) * Math.min(1, dt * 10);
    u.mat.emissiveIntensity = u.mat.userData.base + u.glow * .35;
  });

  if (island) island.position.y = island.userData.baseY + Math.sin(t * 0.8) * 0.06 * a;
  if (hint) hint.position.y = hint.userData.baseY + Math.sin(t * 1.4) * 0.08 * a;

  for (let i = 0; i < PN; i++) {
    const q = fall[i];
    q.y -= dt * q.v * a;
    q.x += (Math.sin(t * .7 + q.ph) * .5 + .25) * dt * a;
    q.z += Math.cos(t * .5 + q.ph) * .3 * dt * a;
    q.rx += dt * q.sx * a;
    q.ry += dt * q.sy * a;

    if (q.y < 0.5) {
      q.y = 13;
      q.x = (Math.random() - .5) * 10;
      q.z = (Math.random() - .5) * 10;
    }
    if (q.x > 5) q.x = -5;

    dummy.position.set(q.x, q.y, q.z);
    dummy.rotation.set(q.rx, q.ry, 0);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  // hover glow and click flash on house parts
  for (const m of houseMeshes) {
    const u = m.userData;
    u.flash *= Math.pow(0.04, dt);
    u.glow += ((m === hovered ? 0.5 : 0) - u.glow) * Math.min(1, dt * 10);
    const k = Math.min(1, u.glow + u.flash);
    m.material.emissive.copy(u.em0).lerp(TINT, k);
    m.material.emissiveIntensity = u.ei0 + (u.nb || 0) * night.k + k * 0.6;
  }

  // click pop on the showcase props
  for (const o of props) {
    const u = o.userData;
    u.pop = Math.max(0, u.pop - dt * 3);
    o.scale.setScalar(1 + 0.2 * Math.sin(u.pop * Math.PI));
  }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);


// loading screen
const pctEl = document.getElementById('pct');
const fillEl = document.getElementById('barfill');
const enterBtn = document.getElementById('enter');
const loaderEl = document.getElementById('loader');
let pctTarget = 0;
let pctShown = 0;

function bump(v) {
  pctTarget = Math.max(pctTarget, v);
}

// real download progress when known, otherwise a slow creep up to 70 percent
const pctTick = setInterval(() => {
  if (pctTarget < 70) pctTarget += 0.5;
  pctShown += (pctTarget - pctShown) * 0.2;
  const v = Math.round(pctShown);
  pctEl.textContent = v + '%';
  fillEl.style.width = v + '%';
}, 80);

function startIntro() {
  const sp1 = new THREE.Spherical().setFromVector3(home.pos.clone().sub(home.target));
  intro = { sp1, start: performance.now(), ms: 10000 };
  controls.enabled = false;
}

enterBtn.onclick = () => {
  loaderEl.classList.add('done');
  introMusic();
  startAmbient();
  startIntro();
};

async function start() {
  let gltf;
  try {
    let lastErr;
    for (const path of [CONFIG.model, ...(CONFIG.modelFallbacks || [])]) {
      try {
        gltf = await new GLTFLoader().loadAsync(path + '?v=' + Date.now(), e => {
          if (e.lengthComputable) bump(e.loaded / e.total * 80);
        });
        console.info('Loaded model from', path);
        break;
      } catch (err) { lastErr = err; console.warn('Model not at', path, err); }
    }
    if (!gltf) throw lastErr;
  } catch (err) {
    console.error('Could not load model:', err);
    clearInterval(pctTick);
    const onFile = location.protocol === 'file:';
    document.querySelector('#loader .jp').textContent = onFile
      ? 'เปิดผ่าน Live Server / http://localhost เท่านั้น (file:// โหลด .glb ไม่ได้)'
      : 'モデルを読み込めません · check CONFIG.model';
    return;
  }
  bump(85);
  await new Promise(r => setTimeout(r, 30));

  island = buildIsland(gltf.scene);
  bump(92);

  const topY = island.position.y;
  controls.target.set(0, topY - 0.3, 0);
  controls.maxDistance = 28;
  controls.minDistance = 1.5;
  controls.maxPolarAngle = Math.PI * 0.52;
  camera.position.set(0, topY + 4.2, 17.5);

  sun.position.set(6, topY + 9, 7);
  sun.target.position.set(0, topY, 0);
  scene.add(sun.target);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, far: 40 });
  sun.shadow.camera.updateProjectionMatrix();
  rim.position.set(-5, topY + 3, -4);

  home = { pos: camera.position.clone(), target: controls.target.clone() };

  night.lamp = matCache.LampGlow || null;
  night.sakura = [matCache.Sakura, matCache.Sakura2].filter(Boolean);
  night.sakura.forEach(m => m.emissive.set(0xff7fae));
  buildNightRig();

  try { await buildText(topY); } catch (err) { console.error('Could not load font:', err); }
  try { await buildWallBoards(); } catch (err) { console.error('Wall boards failed:', err); }
  bump(98);

  const sz = new THREE.Box3().setFromObject(stage).getSize(new THREE.Vector3());
  console.info(`Stage footprint: ${sz.x.toFixed(2)} x ${sz.z.toFixed(2)} (limit 10 x 10)`);

  bump(100);
  setTimeout(() => {
    clearInterval(pctTick);
    pctEl.textContent = '100%';
    fillEl.style.width = '100%';
    enterBtn.hidden = false;
  }, 700);
}
start();
</script>
